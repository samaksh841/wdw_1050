<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered,ordered and description lists</title>
</head>
<body>
    <h1>Unordered</h1>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>Java Script</li>
    </ul>
    <h2>Ordered</h2>
    <ol>
        <li type="A">Install VS Code</li>
        <li type="A">Create file</li>
        <li type="A">Open in browser</li>
    </ol>
    <h2>Description</h2>
    <dl>HTML</dl>
    <dd>Hyper Text Markup Lnaguage</dd>
    <dl>CSS</dl>
    <dd>Cascading Style Sheets</dd>
</body>
</html>
